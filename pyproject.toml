[project]
name = "aseprite-mcp-studio"
version = "0.1.0"
description = "A fast, pure-Python MCP server for pixel art and sprite animation in .aseprite files: draw, convert images to real pixels, rig and animate characters, review and export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michelle" }]
requires-python = ">=3.11"
keywords = ["aseprite", "mcp", "pixel-art", "sprite", "animation", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
aseprite-mcp-studio = "aseprite_mcp_studio.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aseprite_mcp_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
